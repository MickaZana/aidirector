name: Deploy

on:
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # don't cancel production deploys mid-flight

jobs:
  # ─── Next.js → Vercel ────────────────────────────────────────────────────
  web-deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link Vercel project
        # vercel deploy without a link matches an existing project by
        # directory name for the build itself, but never associates the
        # deployment with the project's dashboard-configured Environment
        # Variables — hence NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY going missing
        # at build time despite being set. Linking writes .vercel/project.json
        # so subsequent steps in this job pick up the right project.
        run: pnpm dlx vercel@latest link --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        # --scope is for team accounts only — this deploys under a personal
        # account, where the token is already scoped correctly by default.
        # The Vercel CLI also refuses to run if VERCEL_ORG_ID is set without
        # a matching VERCEL_PROJECT_ID — since no project is linked yet, omit
        # both and let this first deploy auto-create the project. Once it
        # exists, set VERCEL_PROJECT_ID (from the Vercel dashboard) as a repo
        # secret so future deploys reuse the same project instead of forking
        # a new one each run.
        run: |
          pnpm dlx vercel@latest deploy \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --confirm \
            --archive=tgz \
            --yes \
            2>&1

  # ─── Modal workers ────────────────────────────────────────────────────────
  api-deploy:
    name: Deploy API workers to Modal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with ASR extra)
        run: uv sync --extra asr

      - name: Deploy to Modal
        run: uv run modal deploy apps/api/modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  # ─── Pulumi infra ─────────────────────────────────────────────────────────
  infra-deploy:
    name: Deploy Pulumi infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pulumi
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: prod
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Pass all secrets Pulumi needs via env vars (consumed by infra/src/*.ts)
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Deploy infrastructure
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
