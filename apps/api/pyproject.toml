[project]
name = "api"
version = "0.0.0"
description = "AI Director control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.2",
    "rq>=2.0",
    "boto3>=1.35",
    "stripe>=11.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.10",
    "sentry-sdk[fastapi]>=2.18",
    "logfire>=2.0",
    "modal>=0.73",
    "cryptography>=43.0",
    "svix>=1.96.1",
    "slowapi>=0.1.10",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require external resources (ffmpeg, SOURCE_VIDEO env var)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
