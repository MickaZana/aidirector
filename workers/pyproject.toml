[project]
name = "workers"
version = "0.0.0"
description = "AI Director Modal workers — analyzer, director, renderers"
requires-python = ">=3.11"
dependencies = [
    "api",
    "modal>=0.69",
    "anthropic>=0.42",
    "pydantic>=2.9",
    "boto3>=1.35",
    "ffmpeg-python>=0.2",
    "Pillow>=11.0",
]

[tool.uv.sources]
api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]
